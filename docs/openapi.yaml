        station_id:
          type: integer
          format: int64
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    StreamEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
