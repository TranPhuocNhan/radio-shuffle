version: "2"
sql:
  - schema: "./schema.sql"
    queries: "./query"
    engine: postgresql
    gen:
      go:
        package: dbsqlc
        out: "../pkg/dbsqlc"
        sql_package: pgx/v5
        emit_json_tags: true
        emit_enum_valid_method: false
        emit_exported_queries: true
        emit_exact_table_names: true
        omit_unused_structs: false
        emit_pointers_for_null_types: true
